[package]
name = "apex-heritage"
version = "0.5.0"
edition = "2021"
description = "Cross-platform historical single-seater racing prototype"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["dep:macroquad", "dep:cpal", "dep:gilrs", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.105"
macroquad = { version = "0.4", optional = true }
cpal = {version="0.15",optional=true}
gilrs = { version = "0.11", optional = true }
image = { version = "0.24", default-features = false, features = ["jpeg"], optional = true }

[[bin]]
name = "apex-native"
path = "src/bin/native.rs"
required-features = ["native"]
